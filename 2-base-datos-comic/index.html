<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIKTARA</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="fade-in">
    <header>
        <div class="logo"></div>
        <nav>
            <nav class="nombre-header">
               <a href="#personajes1">Ninove</a> 
               <a href="#personajes1">Naramsin</a> 
               <a href="#personajes1">Adad</a> 
               <a href="#">Re</a> 
               <a href="#">Mas</a> 
               <a href="#">Conectado</a> 
               <a href="#">Buscar</a> 
            </nav>
        </nav>
    </header>

    <main>
        <section class="panel">
            <!-- Carrusel -->
            <div class="carousel">
                <div class="carousel-slide active">
                    <img src="./img/carru1.jpeg" alt="Capítulo 1">
                </div>
                <div class="carousel-slide">
                    <img src="./img/carru2.jpeg" alt="Escena 2">
                </div>
                <div class="carousel-slide">
                    <img src="./img/carru3.png" alt="Fondo">
                </div>
            </div>


            <!-- Indicadores -->
            <div class="carousel-indicators">
                <span class="indicator active" onclick="goToSlide(0)"></span>
                <span class="indicator" onclick="goToSlide(1)"></span>
                <span class="indicator" onclick="goToSlide(2)"></span>
            </div>

            <!-- Contenido sobre el carrusel -->
            <div class="panel-conte">
                <h1>PIKTARA</h1>
                <div class="panel-btn">
                    <button class="repro-btn">Reproducir</button>
                    <button class="trailer-btn">Trailer</button>
                </div>
            </div>
        </section>

        <section class="section" id="personajes1">
            <h2>Capítulos</h2>
            <div class="personajes"></div>
        </section>

        <section class="section1">
            <h2>Personajes</h2>
            <div class="personajes1"></div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
